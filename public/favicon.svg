<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="keetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#090d16" stroke="url(#keetGradient)" stroke-width="16" />
  
  <!-- Glowing Code Symbol <> K -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M170 170 L110 256 L170 342" stroke="url(#keetGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stylized K Center -->
    <path d="M226 160 V352 M316 160 L226 256 L316 352" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Bracket > -->
    <path d="M342 170 L402 256 L342 342" stroke="url(#keetGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
